# Render's free plan sleeps after 15 minutes without visitors, and waking takes about 50 seconds.
# This pings the health check every 10 minutes so shoppers don't wait. It also fails (and GitHub
# emails you) if the API is down. GitHub may delay scheduled runs by a few minutes.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://aanchol-api.onrender.com/api/health
